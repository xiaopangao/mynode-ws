<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星河入梦 - 诗歌</title>
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Songti SC", "SimSun", "STSong", serif; /* 使用宋体增强文学感 */
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); /* 深邃夜空渐变 */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e0e0e0;
            padding: 20px;
        }

        /* 诗歌卡片容器 */
        .card {
            background: rgba(255, 255, 255, 0.05); /* 玻璃拟态效果 */
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem 4rem;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            max-width: 600px;
            width: 100%;
            text-align: center;
            opacity: 0; /* 初始隐藏，用于动画 */
            animation: fadeIn 2s ease-out forwards;
        }

        /* 标题样式 */
        h1 {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            letter-spacing: 0.5rem;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            position: relative;
            display: inline-block;
        }

        /* 标题下方的装饰线 */
        h1::after {
            content: '';
            display: block;
            width: 60%;
            height: 1px;
            background: rgba(255,255,255,0.4);
            margin: 15px auto 0;
        }

        /* 诗句内容样式 */
        .poem-content {
            font-size: 1.25rem;
            line-height: 2.2;
            margin-bottom: 2rem;
            font-weight: 300;
        }

        .poem-paragraph {
            margin-bottom: 2rem;
        }

        /* 落款样式 */
        .footer {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 2rem;
            font-style: italic;
        }

        /* 简单的淡入动画 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 移动端适配 */
        @media (max-width: 600px) {
            .card {
                padding: 2rem;
            }
            h1 {
                font-size: 1.8rem;
            }
            .poem-content {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>星河入梦</h1>
        
        <div class="poem-content">
            <div class="poem-paragraph">
                白昼的喧嚣终归于尘土，<br>
                此刻只有风还在低诉。<br>
                月光把影子拉得修长，<br>
                那是时光写下的情书。
            </div>

            <div class="poem-paragraph">
                不必追问明日去向何方，<br>
                且看头顶这片深邃星苍。<br>
                在此刻的静谧里轻轻安放，<br>
                每一个来不及做的梦。
            </div>
        </div>

        <div class="footer">
            2026年 · 静夜思
        </div>
    </div>

</body>
</html>
